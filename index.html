<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicoRecorder Hub - Rozcestník</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Horní navigace -->
    <nav class="top-nav">
        <div class="nav-logo">
            <span class="logo-icon">🎙️</span>
        </div>
    </nav>

    <!-- Hlavní kontejner -->
    <main class="main-container">
        <div class="hub-card">
            
            <!-- Hlavička karty s tlačítkem pro zobrazení formuláře -->
            <div class="card-header">
                <h2>Moje Odkazy</h2>
                <button id="toggleFormBtn" class="btn-add">+ Přidat stránku</button>
            </div>

            <!-- Formulář pro přidání nové stránky (ve výchozím stavu skrytý) -->
            <form id="addLinkForm" class="add-form hidden">
                <div class="form-group">
                    <label for="linkTitle">Název stránky *</label>
                    <input type="text" id="linkTitle" placeholder="např. GitHub" required>
                </div>

                <div class="form-group">
                    <label for="linkUrl">URL adresa *</label>
                    <input type="url" id="linkUrl" placeholder="https://github.com" required>
                </div>

                <div class="form-group">
                    <label for="linkDesc">Popis stránky (volitelně)</label>
                    <input type="text" id="linkDesc" placeholder="např. Moje kódové repozitáře">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Uložit do Firebase</button>
                    <button type="button" id="cancelFormBtn" class="btn-cancel">Zrušit</button>
                </div>
            </form>

            <!-- Seznam uložených odkazů načtených z Firebase -->
            <div id="linksContainer" class="links-grid">
                <p class="loading-text">Načítám odkazy z databáze...</p>
            </div>

        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurace Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyChLAQmzNz3tXtWWwpjwt8_P7fwdOwqvC8",
            authDomain: "test-stranky-94ae7.firebaseapp.com",
            projectId: "test-stranky-94ae7",
            storageBucket: "test-stranky-94ae7.firebasestorage.app",
            messagingSenderId: "414055116493",
            appId: "1:414055116493:web:66409876ae639b13428384",
            measurementId: "G-3STPN6Z7G5"
        };

        // Inicializace Firebase a Firestore
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // UI elementy
        const toggleFormBtn = document.getElementById('toggleFormBtn');
        const cancelFormBtn = document.getElementById('cancelFormBtn');
        const addLinkForm = document.getElementById('addLinkForm');
        const linksContainer = document.getElementById('linksContainer');

        // Přepínání viditelnosti formuláře
        toggleFormBtn.addEventListener('click', () => addLinkForm.classList.toggle('hidden'));
        cancelFormBtn.addEventListener('click', () => addLinkForm.classList.add('hidden'));

        // Načítání dat z Firebase Cloud Firestore v reálném čase
        const linksRef = collection(db, "links");
        const q = query(linksRef, orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            linksContainer.innerHTML = '';

            if (snapshot.empty) {
                linksContainer.innerHTML = '<p class="empty-text">Zatím nebyly přidány žádné odkazy.</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const linkCard = document.createElement('a');
                linkCard.href = data.url;
                linkCard.target = '_blank';
                linkCard.className = 'hub-link-card';

                linkCard.innerHTML = `
                    <div class="link-icon-bg">🔗</div>
                    <div class="link-details">
                        <span class="link-name">${escapeHtml(data.title)}</span>
                        ${data.description ? `<span class="link-desc">${escapeHtml(data.description)}</span>` : ''}
                    </div>
                    <span class="link-arrow">➔</span>
                `;

                linksContainer.appendChild(linkCard);
            });
        });

        // Odeslání formuláře a uložení do Firebase
        addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const description = document.getElementById('linkDesc').value.trim();

            try {
                await addDoc(collection(db, "links"), {
                    title: title,
                    url: url,
                    description: description,
                    createdAt: new Date()
                });

                addLinkForm.reset();
                addLinkForm.classList.add('hidden');
            } catch (error) {
                console.error("Chyba při ukládání do Firebase:", error);
                alert("Nepodařilo se uložit odkaz. Zkontroluj nastavení "Rules" ve Firebase console.");
            }
        });

        // Pomocná funkce pro bezpečnost (XSS ochrana)
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>

</body>
</html>
