                .replace(/"/g, "&quot;");
        }

        function showMessage(text, type) {
            formMessage.textContent = text;
            formMessage.className = `form-message ${type}`;
            setTimeout(() => { formMessage.className = 'form-message hidden'; }, 4000);
        }

        function clearForm() {
            inputTitle.value = '';
            inputUrl.value   = '';
            inputDesc.value  = '';
        }

        function openForm() {
            addLinkForm.classList.remove('hidden');
            toggleFormBtn.textContent = '✕ Zavřít';
            inputTitle.focus();
        }

        function closeForm() {
            addLinkForm.classList.add('hidden');
            toggleFormBtn.textContent = '+ Přidat stránku';
            clearForm();
        }

        // ─── Mazací režim ────────────────────────────────────────────

        function enableDeleteMode() {
            deleteModeOn = true;
            deleteModeBtn.classList.add('active');
            deleteModeBtn.textContent = '✕ Zrušit mazání';
            linksContainer.classList.add('delete-mode');
            closeForm(); // zavři formulář pokud byl otevřený
        }

        function disableDeleteMode() {
            deleteModeOn = false;
            deleteModeBtn.classList.remove('active');
            deleteModeBtn.textContent = '🗑️ Mazat';
            linksContainer.classList.remove('delete-mode');
        }

        // ─── Modál hesla ─────────────────────────────────────────────

        function openPasswordModal(action) {
            pendingAction = action;
            // Nastav text modálu podle akce
            if (action === 'add') {
                modalTitle.textContent    = '🔒 Admin přístup';
                modalSubtitle.textContent = 'Zadej heslo pro přidání nového odkazu.';
            } else if (action === 'delete') {
                modalTitle.textContent    = '🔒 Admin přístup';
                modalSubtitle.textContent = 'Zadej heslo pro aktivaci mazacího režimu.';
            }
            passwordInput.value = '';
            modalError.classList.remove('visible');
            passwordModal.classList.remove('hidden');
            setTimeout(() => passwordInput.focus(), 100);
        }

        function closePasswordModal() {
            passwordModal.classList.add('hidden');
            passwordInput.value = '';
            modalError.classList.remove('visible');
            pendingAction = null;
        }

        function confirmPassword() {
            if (passwordInput.value === ADMIN_PASSWORD) {
                adminUnlocked = true;
                closePasswordModal();
                // Proveď akci podle toho, co čekalo
                if (pendingAction === 'add') {
                    openForm();
                } else if (pendingAction === 'delete') {
                    enableDeleteMode();
                }
            } else {
                modalError.classList.add('visible');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmPassword();
        });

        modalConfirmBtn.addEventListener('click', confirmPassword);
        modalCancelBtn.addEventListener('click',  closePasswordModal);
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) closePasswordModal();
        });

        // ─── Modál potvrzení smazání ─────────────────────────────────

        function openDeleteConfirm(docId, title) {
            pendingDeleteId    = docId;
            pendingDeleteTitle = title;
            deleteConfirmText.textContent = `Opravdu chceš smazat „${title}"? Tato akce je nevratná.`;
            deleteConfirmModal.classList.remove('hidden');
        }

        function closeDeleteConfirm() {
            deleteConfirmModal.classList.add('hidden');
            pendingDeleteId    = null;
            pendingDeleteTitle = '';
        }

        deleteConfirmBtn.addEventListener('click', async () => {
            if (!pendingDeleteId) return;
            try {
                await deleteDoc(doc(db, "links", pendingDeleteId));
                closeDeleteConfirm();
            } catch (err) {
                console.error("Chyba při mazání:", err);
                alert('❌ Nepodařilo se smazat odkaz. Zkontroluj Firestore pravidla.');
                closeDeleteConfirm();
            }
        });

        deleteCancelBtn.addEventListener('click', closeDeleteConfirm);
        deleteConfirmModal.addEventListener('click', (e) => {
            if (e.target === deleteConfirmModal) closeDeleteConfirm();
        });

        // ─── Tlačítko "Mazat" ────────────────────────────────────────
        deleteModeBtn.addEventListener('click', () => {
            if (deleteModeOn) {
                // Mazací režim je zapnutý → vypni ho
                disableDeleteMode();
            } else {
                // Zapni mazací režim — ověř heslo (pokud ještě není přihlášen)
                if (adminUnlocked) {
                    enableDeleteMode();
                } else {
                    openPasswordModal('delete');
                }
            }
        });

        // ─── Tlačítko "Přidat stránku" ───────────────────────────────
        toggleFormBtn.addEventListener('click', () => {
            if (addLinkForm.classList.contains('hidden')) {
                if (adminUnlocked) {
                    openForm();
                } else {
                    openPasswordModal('add');
                }
            } else {
                closeForm();
            }
        });

        cancelFormBtn.addEventListener('click', closeForm);

        // ─── Uložení odkazu ──────────────────────────────────────────
        submitFormBtn.addEventListener('click', async () => {
            const title = inputTitle.value.trim();
            const url   = inputUrl.value.trim();
            const desc  = inputDesc.value.trim();

            if (!title) {
                showMessage('⚠️ Zadej název stránky.', 'error');
                inputTitle.focus();
                return;
            }
            try { new URL(url); } catch {
                showMessage('⚠️ Zadej platnou URL (např. https://github.com).', 'error');
                inputUrl.focus();
                return;
            }

            submitFormBtn.disabled    = true;
            submitFormBtn.textContent = 'Ukládám...';

            try {
                await addDoc(collection(db, "links"), {
                    title:       title,
                    url:         url,
                    description: desc,
                    createdAt:   new Date()
                });

                showMessage('✅ Odkaz uložen!', 'success');
                clearForm();
                setTimeout(() => closeForm(), 1500);

            } catch (err) {
                console.error(err);
                showMessage('❌ Chyba při ukládání. Zkontroluj Firestore pravidla.', 'error');
            } finally {
                submitFormBtn.disabled    = false;
                submitFormBtn.textContent = 'Uložit do Firebase';
            }
        });

        // ─── Vytvoření karty odkazu ──────────────────────────────────
        function createLinkCard(docId, data) {
            const card = document.createElement('a');
            card.href      = escapeHtml(data.url);
            card.target    = '_blank';
            card.rel       = 'noopener noreferrer';
            card.className = 'hub-link-card';
            card.dataset.id = docId; // uložíme ID dokumentu pro mazání

            card.innerHTML = `
                <div class="link-icon-bg">🔗</div>
                <div class="link-details">
                    <span class="link-name">${escapeHtml(data.title)}</span>
                    ${data.description ? `<span class="link-desc">${escapeHtml(data.description)}</span>` : ''}
                </div>
                <span class="link-arrow">➔</span>
                <button class="btn-delete-link" title="Smazat odkaz">🗑️</button>
            `;

            // Kliknutí na tlačítko koše → otevři potvrzovací dialog
            card.querySelector('.btn-delete-link').addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openDeleteConfirm(docId, data.title);
            });

            return card;
        }

        // ─── Real-time načítání z Firestore ──────────────────────────
        const q = query(collection(db, "links"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            // Zachovej stav mazacího režimu při překreslení
            const wasDeleteMode = deleteModeOn;

            linksContainer.innerHTML = '';

            if (snapshot.empty) {
                linksContainer.innerHTML = '<p class="empty-text">Zatím žádné odkazy. Přidej první!</p>';
                return;
            }

            snapshot.forEach(docSnap => {
                linksContainer.appendChild(createLinkCard(docSnap.id, docSnap.data()));
            });

            // Obnov třídu mazacího režimu po překreslení
            if (wasDeleteMode) {
                linksContainer.classList.add('delete-mode');
            }

        }, (err) => {
            console.error(err);
            linksContainer.innerHTML = '<p class="empty-text">❌ Nepodařilo se načíst data. Zkontroluj Firestore pravidla.</p>';
        });

    </script>

</body>
</html>
