<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicoRecorder Hub - Rozcestník</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styly aplikace -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Horní navigace -->
    <nav class="top-nav">
        <div class="nav-logo">
            <span class="logo-icon">🎙️</span>
            <span class="logo-text">PicoRecorder Hub</span>
        </div>
    </nav>

    <!-- Hlavní kontejner -->
    <main class="main-container">
        <div class="hub-card">

            <!-- Hlavička karty s tlačítkem pro zobrazení formuláře -->
            <div class="card-header">
                <h2>Moje Odkazy</h2>
                <button id="toggleFormBtn" class="btn-add">+ Přidat stránku</button>
            </div>

            <!-- Formulář pro přidání nové stránky (ve výchozím stavu skrytý) -->
            <div id="addLinkForm" class="add-form hidden">
                <div class="form-group">
                    <label for="linkTitle">Název stránky *</label>
                    <input type="text" id="linkTitle" placeholder="např. GitHub">
                </div>

                <div class="form-group">
                    <label for="linkUrl">URL adresa *</label>
                    <input type="url" id="linkUrl" placeholder="https://github.com">
                </div>

                <div class="form-group">
                    <label for="linkDesc">Popis stránky (volitelně)</label>
                    <input type="text" id="linkDesc" placeholder="např. Moje kódové repozitáře">
                </div>

                <div class="form-actions">
                    <button type="button" id="submitFormBtn" class="btn-submit">Uložit do Firebase</button>
                    <button type="button" id="cancelFormBtn" class="btn-cancel">Zrušit</button>
                </div>

                <!-- Zpráva o výsledku uložení -->
                <p id="formMessage" class="form-message hidden"></p>
            </div>

            <!-- Seznam uložených odkazů načtených z Firebase -->
            <div id="linksContainer" class="links-grid">
                <p class="loading-text">⏳ Načítám odkazy z databáze...</p>
            </div>

        </div>
    </main>

    <!--
        DŮLEŽITÉ: Firebase ES moduly nelze načíst přes klasický <script src="">.
        Proto je celý JS kód v js/main.js, ale index.html ho načítá
        jako type="module" — to je jediný správný způsob pro Firebase SDK v9+.
    -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
